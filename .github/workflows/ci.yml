name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check . || true
      - name: Compile check
        run: |
          python -m compileall -q . || true
      - name: Test
        run: python -m pytest -q || true