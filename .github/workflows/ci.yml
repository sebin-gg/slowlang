name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.14.4
          ruff check . || true
      - name: Compile check
        run: |
          python -m compileall -q .
      - name: Test
        run: |
          python -m pip install --quiet pytest==8.3.4
          python -m pytest -q