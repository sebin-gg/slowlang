[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slowlang"
version = "1.0.0"
description = "A Python-based esoteric programming language that enforces a ~30 WPM typing cap - angry ASCII turtle, rage lockouts, haiku errors."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sebin Mathew"},
    {name = "Abin Zachariah Abraham"},
]
keywords = ["esolang", "esoteric-programming-language", "tortoiselang", "joke-language", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
ide = ["rich>=13.0.0", "keyboard>=0.13.5", "fpdf2>=2.7.9"]
test = ["pytest>=8.0.0"]

[project.scripts]
slowlang = "tortoise_lang:main"

[project.urls]
Homepage = "https://sebin-gg.github.io/slowlang/"
Repository = "https://github.com/sebin-gg/slowlang"
Documentation = "https://esolangs.org/wiki/SlowLang"

[tool.setuptools]
py-modules = ["tortoise_lang", "typing_engine", "sarcasm_engine", "ascii_turtle", "feature_popup", "exporter"]
